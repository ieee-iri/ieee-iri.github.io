name: Deploy 2027 to Root

# The current conference year's folder is the source of truth; its pages are
# copied to the repo root (the main site) with ../ asset paths rewritten.
# To switch years: update YEAR, the paths filter, and the name above.

on:
  push:
    branches:
      - main
    paths:
      - '2027/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  YEAR: '2027'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy ${{ env.YEAR }} files to root and fix paths
        run: |
          echo "Deploying $YEAR files to root..."

          # Deploy every page in the year folder, so new pages need no workflow edit
          shopt -s nullglob
          for src in "$YEAR"/*.html; do
            file="$(basename "$src")"
            echo "Processing $file..."
            # Copy file and update paths
            sed 's|../css/|css/|g; s|../js/|js/|g; s|../resources/|resources/|g; s|../fonts/|fonts/|g' \
              "$src" > "$file"
          done

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-deploy: Update root files from $YEAR [skip ci]" && git push)
